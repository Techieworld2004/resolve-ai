# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/resolveai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=suman2004

# JPA / Hibernate Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8081
spring.application.name=resolveai_db
spring.main.allow-bean-definition-overriding=true

# ResolveAI LLM & AI Configuration
resolveai.llm.provider=groq
resolveai.llm.groq-api-key=${GROQ_API_KEY:}
resolveai.llm.groq-endpoint=https://api.groq.com/openai/v1/chat/completions
resolveai.llm.model=openai/gpt-oss-120b